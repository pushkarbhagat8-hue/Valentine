<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Will You Be My Valentine?</title>
  <style>
    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      font-family: 'Poppins', sans-serif;
      text-align: center;
    }

    h1 {
      font-size: 2.2rem;
      color: #fff;
      margin-bottom: 25px;
    }

    .buttons {
      display: flex;
      gap: 20px;
      justify-content: center;
    }

    button {
      border: none;
      padding: 15px 30px;
      font-size: 1.2rem;
      border-radius: 30px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    #yes {
      background-color: #ff4d6d;
      color: white;
    }

    #no {
      background-color: #fff;
      color: #ff4d6d;
    }
  </style>
</head>
<body>

  <div>
    <h1>Will you be my Valentine? 💖</h1>
    <div class="buttons">
      <button id="yes" onclick="yesClick()">Yes 💘</button>
      <button id="no" onclick="noClick()">No 😶</button>
    </div>
  </div>

  <script>
    let yesSize = 1.2;

    function noClick() {
      yesSize += 0.3;
      document.getElementById("yes").style.transform = `scale(${yesSize})`;
    }

    function yesClick() {
      document.body.innerHTML = `
        <h1 style="color:white;font-size:3rem;">
          Yayyy! 💕 I knew it 😍<br>
          Happy Valentine’s 💖
        </h1>
      `;
    }
  </script>

</body>
</html>
