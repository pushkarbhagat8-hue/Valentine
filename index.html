<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For You</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  background: linear-gradient(135deg, #1f1f1f, #3a3a3a);
  font-family: 'Georgia', serif;
  display: flex;
  justify-content: center;
  align-items: center;
  color: #fff;
}

.card {
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
  padding: 35px;
  border-radius: 18px;
  max-width: 340px;
  text-align: center;
  animation: fadeIn 1.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to   { opacity: 1; transform: translateY(0); }
}

.photo {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid rgba(255,255,255,0.6);
  margin-bottom: 20px;
}

h1 {
  font-size: 1.4rem;
  font-weight: normal;
  margin-bottom: 10px;
}

p {
  font-size: 0.95rem;
  opacity: 0.85;
  margin-bottom: 25px;
  line-height: 1.5;
}

.buttons {
  display: flex;
  justify-content: space-between;
  gap: 15px;
}

button {
  flex: 1;
  padding: 10px 0;
  font-size: 0.95rem;
  border-radius: 25px;
  border: none;
  cursor: pointer;
  transition: 0.3s ease;
}

.yes {
  background: #ffffff;
  color: #1f1f1f;
}

.no {
  background: transparent;
  color: #ffffff;
  border: 1px solid rgba(255,255,255,0.6);
}

button:hover {
  transform: translateY(-2px);
}
</style>
</head>

<body>

<div class="card" id="card">
  <img src="gf.jpg" class="photo" alt="You">

  <h1>Hey.</h1>

  <p>
    I don’t believe in dramatic words.<br>
    I just know that moments feel better when you’re part of them.
  </p>

  <h1>Will you be my Valentine?</h1>

  <div class="buttons">
    <button class="no">No</button>
    <button class="yes" onclick="yesClick()">Yes</button>
  </div>
</div>

<script>
function yesClick() {
  document.getElementById("card").innerHTML = `
    <h1>Thank you.</h1>
    <p style="margin-top:15px;">
      That means more to me than I can explain.<br><br>
      I’m really glad it’s you.
    </p>
  `;
}
</script>

</body>
</html>
